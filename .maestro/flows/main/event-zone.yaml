appId: com.butingmobile
name: Event zone map
tags:
  - main
---
- runFlow: ../../shared/enter-main.yaml
# 지도 중앙은 채팅 패널이라 왼쪽만 탭
- tapOn:
    id: home.eventZoneMap
    point: 15%, 50%
- runFlow: ../../shared/dismiss-optional.yaml
- extendedWaitUntil:
    visible:
      id: eventZone.screen
    timeout: 20000
- tapOn:
    id: nav.back
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 10000
