appId: com.butingmobile
name: Setup — skip onboarding to login
tags:
  - smoke
  - setup
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: language.screen
    timeout: 45000
- tapOn:
    id: language.option.ko
- tapOn:
    id: language.continue
- extendedWaitUntil:
    visible:
      id: onboarding.screen
    timeout: 15000
- tapOn:
    id: onboarding.skipAll
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 20000
